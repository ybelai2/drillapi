spring.application.name=drillapi
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/drill}
spring.datasource.username=${DATABASE_USERNAME:drill}
spring.datasource.password=${DATABASE_PASSWORD:drill}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://study-cs.vercel.app,https://os439-frontend.vercel.app}
server.error.include-message=never
